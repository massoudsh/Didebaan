# Didebaan console — nginx site configuration.
# Serves the built SPA, proxies API/admin traffic to Django, and exposes the
# static files collected by the backend container through a shared volume.

upstream didebaan_api {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    client_max_body_size 10m;
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://didebaan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /admin/ {
        proxy_pass http://didebaan_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django admin CSS/JS collected by the backend container.
    location /static/ {
        alias /static-assets/;
        access_log off;
        expires 7d;
    }

    # Hashed Vite bundles are safe to cache for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA routes: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
