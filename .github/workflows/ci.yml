# Regalion AML — CI Pipeline
# Issue #38: test, lint, migrate-check on every push/PR
# Runs on: push to main/develop, pull_request to main

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: regalion_aml_test
          POSTGRES_USER: regalion
          POSTGRES_PASSWORD: testpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings.development
      SECRET_KEY: ci-test-secret-key-not-for-production
      USE_POSTGRES: "true"
      DB_NAME: regalion_aml_test
      DB_USER: regalion
      DB_PASSWORD: testpass
      DB_HOST: localhost
      DB_PORT: "5432"
      DEBUG: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Lint with flake8
        run: |
          cd backend
          flake8 . \
            --max-line-length=120 \
            --exclude=migrations,venv,.git,__pycache__ \
            --ignore=E501,W503
        continue-on-error: false

      - name: Check Django system
        run: |
          cd backend
          python manage.py check --deploy --settings=config.settings.production \
            SECRET_KEY=ci-check ALLOWED_HOSTS=localhost \
            || python manage.py check

      - name: Run migrations (migrate check)
        run: |
          cd backend
          python manage.py migrate --noinput

      - name: Run tests
        run: |
          cd backend
          python manage.py test aml --verbosity=2

      - name: Check for missing migrations
        run: |
          cd backend
          python manage.py makemigrations --check --dry-run
